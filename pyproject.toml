[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgrave-engine"
version = "0.1.0"
description = "Defensive, read-only GitHub exposure scanner"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "pydantic>=2.0",
]

[project.scripts]
gitgrave = "gitgrave_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["gitgrave_engine*"]